[project]
name = "tsib"
version = "0.1.6"
description = "Time Series Initialization for Buildings"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Leander Kotzur", email = "l.kotzur@fz-juelich.de" },
]
requires-python = ">=3.12"
keywords = [
    "buildings",
    "thermal load",
    "electricity load",
    "optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pvlib",
    "pandas",
    "Pyomo",
    "numpy",
    "matplotlib",
    "xlrd",
    "tsorb",
    "tinydb",
    "openpyxl",
    "oemof-solph>=0.6.4",
]

[project.urls]
Homepage = "https://github.com/simu-flex-lokal/tsib"

[project.optional-dependencies]
gurobi = [
    "gurobipy>=13.0.2",
]
highs = [
    "highspy",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]
examples = ["jupyter", "tsam"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tsib"]
exclude = [
    "tsib/data/results/**/*.csv",
    "tsib/data/results/**/*.json",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "tsib/data/results/**/*.csv",
    "tsib/data/results/**/*.json",
    "/examples",
    "/static",
]

# Resolve tsorb straight from its GitHub repo instead of PyPI, so tsib
# always picks up whatever's on tsorb's master branch without needing a
# PyPI release first. Only affects `uv lock`/`uv sync` — does not change
# the published wheel's dependency metadata (still the tsorb constraint
# above).
[tool.uv.sources]
tsorb = { git = "https://github.com/simu-flex-lokal/tsorb", branch = "master" }
